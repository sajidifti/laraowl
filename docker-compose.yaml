name: laraowl

x-app: &app
  image: laraowl:${APP_VERSION:-latest}
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - laraowl-network
  volumes:
    - storage:/usr/share/caddy/html/storage:rw
    - public:/usr/share/caddy/html/public:rw

x-worker: &worker
  <<: *app
  environment:
    IS_WORKER: "true"
  depends_on:
    app:
      condition: service_started
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    <<: *worker
    command: php artisan horizon

  schedule-worker:
    <<: *worker
    command: php artisan schedule:work

  reverb:
    <<: *worker
    command: php artisan reverb:start
    volumes: []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - ${CADDY_BIND_IP:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80
      - ${CADDY_BIND_IP:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443
    environment:
      # A hostname enables automatic HTTPS; use ":80" when TLS is terminated upstream.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${APP_HOSTNAME}, ws.${APP_HOSTNAME}}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - storage:/usr/share/caddy/html/storage:rw
      - public:/usr/share/caddy/html/public:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - laraowl-network

  db:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laraowl-network

  redis:
    image: redis:${REDIS_VERSION:-8}-alpine
    restart: always
    command: >
      redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
      --rename-command FLUSHDB "" --rename-command FLUSHALL ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laraowl-network

volumes:
  db-data:
  redis-data:
  storage:
  public:
  caddy_data:
  caddy_config:

networks:
  laraowl-network:
    driver: bridge
